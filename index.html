<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PITA QR Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f4f7;
      margin: 0;
      padding: 16px;
      color: #202124;
    }

    .container {
      max-width: 520px;
      margin: auto;
    }

    .header {
      background: #102a43;
      color: white;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 16px;
    }

    .card {
      background: white;
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 8px;
      background: #087f5b;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #9aa5b1;
    }

    #reader {
      width: 100%;
      margin-top: 16px;
    }

    #message {
      display: none;
      margin-top: 12px;
      padding: 12px;
      border-radius: 8px;
    }

    .success {
      display: block !important;
      background: #d3f9d8;
      color: #186a3b;
    }

    .error {
      display: block !important;
      background: #ffe3e3;
      color: #9b2226;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="header">
      <h2>PITA QR SCANNER</h2>
      <div>Scanner Absensi Siswa</div>
    </div>

    <div class="card">
      <button id="startButton" onclick="startScanner()">
        Mulai Scanner
      </button>

      <button id="stopButton" onclick="stopScanner()" disabled>
        Hentikan Kamera
      </button>

      <div id="reader"></div>
      <div id="message"></div>
    </div>
  </div>

  <script>
    let scanner = null;
    let processing = false;

    function showMessage(text, success) {
      const box = document.getElementById("message");
      box.textContent = text;
      box.className = success ? "success" : "error";
    }

    function startScanner() {
      if (scanner) return;

      scanner = new Html5Qrcode("reader");

      scanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 250, height: 250 } },
        onScanSuccess,
        function() {}
      )
      .then(function() {
        document.getElementById("startButton").disabled = true;
        document.getElementById("stopButton").disabled = false;
        showMessage("Kamera aktif. Arahkan ke QR siswa.", true);
      })
      .catch(function(error) {
        scanner = null;
        showMessage("Kamera gagal dibuka: " + error, false);
      });
    }

    function stopScanner() {
      if (!scanner) return;

      scanner.stop()
        .then(function() {
          scanner.clear();
          scanner = null;
          document.getElementById("startButton").disabled = false;
          document.getElementById("stopButton").disabled = true;
          showMessage("Kamera dihentikan.", true);
        })
        .catch(function(error) {
          showMessage("Gagal menghentikan kamera: " + error, false);
        });
    }

    function onScanSuccess(decodedText) {
      if (processing) return;

      processing = true;
      showMessage("QR terbaca: " + decodedText, true);

      // Tahap berikutnya: hubungkan hasil QR ke absensi PITA.
      stopScanner();

      setTimeout(function() {
        processing = false;
      }, 2000);
    }
  </script>
</body>
</html>
